# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit Configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit

language: en-US

# Review settings
reviews:
  # Enable automatic reviews on pull requests
  auto_review:
    enabled: true
    # Review drafts so checks complete before the owner authorizes shipping
    drafts: true
    # Review base branches
    base_branches:
      - main
      - develop

  # Review profile (quiet, chill, assertive)
  profile: assertive

  # Request changes on high severity issues
  request_changes_workflow: true

  # Keep approval decisions with the maintainer
  auto_approvals:
    enabled: false
    allow_author_approval: false

  # High-level summary in PR comment
  high_level_summary: true

  # Add poem in summary (fun but optional)
  poem: false

  # Review status in commit status
  review_status: true

  # Collapse walkthrough in comments
  collapse_walkthrough: true

  # Path-based review instructions
  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        - Check for TypeScript best practices
        - Ensure proper error handling
        - Verify input validation for security
        - Check for potential memory leaks
        - Ensure TOON output format is used where applicable

    - path: "src/auth/**"
      instructions: |
        - CRITICAL: Review for security vulnerabilities
        - Ensure OAuth 2.1 best practices
        - Check for token leakage
        - Verify no hardcoded secrets
        - Check credential storage security

    - path: "src/tools/**"
      instructions: |
        - Verify tool schemas are complete
        - Check for input validation
        - Ensure consistent error messages
        - Verify TOON output support

    - path: "src/toon/**"
      instructions: |
        - Check for token efficiency
        - Verify encoding/decoding correctness
        - Test edge cases handling

    - path: "**/*.md"
      instructions: |
        - Check for spelling and grammar
        - Verify links are valid
        - Ensure code examples are correct

  # Tools integration
  tools:
    # GitHub Actions integration
    github-checks:
      enabled: true

    # Language-specific tools
    biome:
      enabled: true
    eslint:
      enabled: true

    # Security scanning
    shellcheck:
      enabled: true

    # Markdown linting
    markdownlint:
      enabled: true


  # Exclude generated files from reviews
  path_filters:
    - "!**/*.lock"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!**/*.min.js"
    - "!**/package-lock.json"

# Chat settings (for interactive comments)
chat:
  auto_reply: true

# Knowledge base (learns from codebase)
knowledge_base:
  opt_out: false
  learnings:
    scope: auto

# Early access features
early_access: true

# Tone of reviews
tone_instructions: |
  - Be constructive and helpful
  - Focus on code quality and security
  - Suggest improvements, not just problems
  - Consider token efficiency for all data output
  - Prioritize security issues in auth-related code
