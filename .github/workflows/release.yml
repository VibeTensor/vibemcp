name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing merged release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Validate selected tag before checkout
        id: selected
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const numeric = '(?:0|[1-9][0-9]*)';
          const pre = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)';
          const semver = new RegExp(`^v${numeric}\\.${numeric}\\.${numeric}(?:-${pre}(?:\\.${pre})*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$`);
          if (!tag || tag !== tag.trim() || !semver.test(tag)) throw new Error('Expected a v-prefixed SemVer tag');
          if (process.env.RELEASE_EVENT === 'workflow_dispatch' && process.env.RELEASE_REF !== 'refs/heads/main') {
            throw new Error('Manual release retries must run the workflow from main');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.selected.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ steps.selected.outputs.tag }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.name !== '@vibetensor/vibemcp' || process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error('Package identity or release tag does not match');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand

      - name: Lint
        run: npm run lint

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Pack release
        run: npm pack --json > release-pack.json

      - name: Verify publishing credential is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Configure an authorized NPM_TOKEN before publishing"
            exit 1
          fi

      - name: Publish to npm
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const [pack] = JSON.parse(fs.readFileSync('release-pack.json', 'utf8'));
          const channel = pack.version.includes('-') ? 'next' : 'latest';
          execFileSync('npm', ['publish', pack.filename, '--access', 'public', '--tag', channel], { stdio: 'inherit' });
          NODE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify registry integrity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const [pack] = JSON.parse(fs.readFileSync('release-pack.json', 'utf8'));
          const endpoint = `https://registry.npmjs.org/@vibetensor%2fvibemcp/${encodeURIComponent(pack.version)}`;
          let matched = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(endpoint, { signal: AbortSignal.timeout(15000) });
            if (response.ok) {
              const remote = await response.json();
              if (remote.name !== pack.name || remote.version !== pack.version || remote.dist?.integrity !== pack.integrity) {
                throw new Error('Published artifact differs from verified tarball');
              }
              matched = true;
              break;
            }
            if (response.status !== 404) throw new Error(`Registry returned ${response.status}`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!matched) throw new Error('Published artifact not visible in registry');
          NODE

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.selected.outputs.tag }}
        run: |
          tarball="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const [pack] = JSON.parse(fs.readFileSync('release-pack.json', 'utf8'));
          if (pack.name !== '@vibetensor/vibemcp' || `v${pack.version}` !== process.env.RELEASE_TAG || !/^vibetensor-vibemcp-[0-9A-Za-z.+-]+\.tgz$/.test(pack.filename)) {
            throw new Error('Invalid verified release artifact');
          }
          if (!fs.statSync(pack.filename).isFile()) throw new Error('Missing release artifact');
          const integrity = `sha512-${createHash('sha512').update(fs.readFileSync(pack.filename)).digest('base64')}`;
          if (integrity !== pack.integrity) throw new Error('Release artifact changed after packing');
          const command = `@vibetensor/vibemcp@${pack.version}`;
          fs.writeFileSync('release-notes.md', `Install with Node.js 22.12 or later:\n\n\x60\x60\x60bash\nnpm install ${command}\n\x60\x60\x60\n\nOr use directly:\n\n\x60\x60\x60bash\nnpx ${command}\n\x60\x60\x60\n`);
          console.log(pack.filename);
          NODE
          )"
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$tarball" --verify-tag --generate-notes --notes-file release-notes.md "${release_flags[@]}"
